name: Build Reynard KeepAwake dylib
on:
  workflow_dispatch:
  push:
    branches: [ keepawake-build ]
    paths:
      - 'ReynardKeepAwake/**'
      - '.github/workflows/keepawake-build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          ref: keepawake-build
          path: source

      - name: Install Theos using official installer
        run: |
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -d "$THEOS/sdks"

      - name: Verify toolchain
        run: |
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          ls "$THEOS/sdks"

      - name: Build dylib
        working-directory: source/ReynardKeepAwake
        run: |
          echo "Project directory: $PWD"
          test -f Makefile
          make clean
          make

      - name: Collect and validate real dylib
        working-directory: source/ReynardKeepAwake
        run: |
          set -euo pipefail
          mkdir -p out
          mapfile -t candidates < <(find .theos -type f -name 'ReynardKeepAwake.dylib' ! -path '*/.dSYM/*')
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one non-dSYM dylib, found ${#candidates[@]}"
            printf '%s\\n' "${candidates[@]}"
            find .theos -type f -name 'ReynardKeepAwake.dylib' -print
            exit 1
          fi
          echo "Selected binary: ${candidates[0]}"
          file "${candidates[0]}"
          file "${candidates[0]}" | grep -q 'dynamically linked shared library'
          cp "${candidates[0]}" out/ReynardKeepAwake.dylib
          cp filter.plist out/
          cp README.md out/
          test -s out/ReynardKeepAwake.dylib
          file out/ReynardKeepAwake.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReynardKeepAwake-dylib
          path: source/ReynardKeepAwake/out/
          if-no-files-found: error
