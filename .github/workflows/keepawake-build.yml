name: Build Reynard KeepAwake dylib
on:
  workflow_dispatch:
  push:
    branches: [ keepawake-build ]
    paths:
      - 'ReynardKeepAwake/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          ref: keepawake-build
          path: source

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git perl unzip curl xz-utils libtinfo6 ldid

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          mkdir -p "$THEOS/toolchain"
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            -o /tmp/iOSToolchain-x86_64.tar.xz
          file /tmp/iOSToolchain-x86_64.tar.xz
          tar -xJf /tmp/iOSToolchain-x86_64.tar.xz -C "$THEOS/toolchain"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          "$THEOS/bin/install-sdk" latest
          test -d "$THEOS/sdks"

      - name: Verify toolchain
        run: |
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          ls "$THEOS/sdks"

      - name: Build dylib
        working-directory: source/ReynardKeepAwake
        run: |
          echo "Project directory: $PWD"
          test -f Makefile
          make clean
          make

      - name: Collect dylib
        working-directory: source/ReynardKeepAwake
        run: |
          mkdir -p out
          find .theos -type f -name 'ReynardKeepAwake.dylib' -exec cp {} out/ \\;
          cp filter.plist out/
          cp README.md out/
          test -s out/ReynardKeepAwake.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReynardKeepAwake-dylib
          path: source/ReynardKeepAwake/out/
          if-no-files-found: error
